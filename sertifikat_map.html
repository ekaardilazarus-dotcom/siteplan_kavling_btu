<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITE MAP SERTIFIKAT BTU KNC</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sertifikat_map.css">
</head>
<body>

  <header class="main-header">
    <h1><span class="futuristic-text">SITE MAP SERTIFIKAT BTU KNC</span></h1>
    <div class="header-actions" style="margin-top:10px; display:flex; gap:10px;">
      <a href="index.html" class="back-home-btn"><span>🏠</span> Kembali ke Utama</a>
      <a href="pencarian_sertifikat.html" class="back-home-btn" style="background:#673ab7;"><span>🔍</span> Pencarian Sertifikat</a>
    </div>
  </header>

  <div class="cert-map-layout">
    <aside class="smap-left">
      <div id="cert-map">
        <div class="smap-loading">
          <div class="smap-spinner"></div>
          <div>Memuat peta sertifikat...</div>
        </div>
      </div>
    </aside>

    <aside class="smap-right">
      <div class="smap-right-inner">
        <h3>Pencarian & Status</h3>

        <div class="smap-toolbar">
          <button class="smap-btn" data-bank="UMM" style="background: rgba(128,0,0,0.9);">UMM</button>
          <button class="smap-btn" data-bank="UNISMA" style="background: rgba(0,100,0,0.9);">UNISMA</button>
          <button class="smap-btn" data-bank="ABC" style="background: rgba(128,0,128,0.9);">ABC</button>
          <button class="smap-btn" data-bank="BTN" style="background: rgba(33,150,243,0.9);">BTN</button>
          <button class="smap-btn" data-bank="BUKOPIN" style="background: rgba(255,235,59,0.9); color:#333; text-shadow:none;">BUKOPIN</button>
          <button class="smap-btn" data-bank="MANDIRI" style="background: rgba(13,71,161,0.9);">MANDIRI</button>
          <button class="smap-btn" data-bank="LAINNYA" style="background: rgba(255,255,255,0.9); color:#333; text-shadow:none;">LAINNYA</button>
        </div>

        <div class="smap-actions" style="margin-bottom:8px;">
          <a href="pencarian_sertifikat.html" class="back-home-btn" style="background:#673ab7;">
            <span>🔍</span> Cari Berdasarkan Sertifikat
          </a>
        </div>
        <div class="smap-search">
          <div class="smap-print-toolbar">
            <button id="smapPrintFull" class="smap-print-btn">Cetak Keseluruhan</button>
            <button id="smapPrintView" class="smap-print-btn">Cetak Tampilan Saat Ini</button>
          </div>
        </div>

        <div id="smap-status-panel" class="smap-status-panel">
          <div class="smap-status-body">
          
          </div>
        </div>
      </div>
    </aside>
  </div>

  <footer class="futuristic-footer">
    <span class="futuristic-text" style="font-weight: normal; font-size: 8px;">web by @ekalazarus</span>
  </footer>

  <script src="js/sertifikat_map.js" defer></script>
</body>
</html>
